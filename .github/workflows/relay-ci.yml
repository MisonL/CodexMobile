name: Relay CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/relay-phase1

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check server/relay-server.js
          node --check server/relay-runtime.js
          node --check server/relay-runtime-mac.js
          node --check server/relay-runtime-pending.js
          node --check server/relay-runtime-realtime.js
          node --check server/relay-runtime-status.js
          node --check server/relay-runtime-stream-response.js
          node --check server/relay-runtime-token-cache.js
          node --check server/relay-http.js
          node --check server/relay-http-body.js
          node --check server/relay-http-static.js
          node --check server/relay-http-stream.js
          node --check server/relay-protocol.js
          node --check server/index.js
          node --check server/http-utils.js
          node --check server/realtime-voice.js
          node --check server/realtime-voice-config.js
          node --check server/realtime-voice-handoff.js
          node --check server/realtime-voice-providers.js
          node --check server/lark-cli.js
          node --check server/lark-cli-definitions.js
          node --check server/lark-cli-runner.js
          node --check server/lark-cli-status.js
          node --check scripts/relay-mac-client-backpressure.mjs
          node --check scripts/relay-mac-client-body.mjs
          node --check scripts/relay-mac-client-config.mjs
          node --check scripts/relay-mac-client-http.mjs
          node --check scripts/relay-mac-client-http-response.mjs
          node --check scripts/relay-mac-client-local.mjs
          node --check scripts/relay-mac-client-reconnect.mjs
          node --check scripts/relay-mac-client-realtime.mjs
          node --check scripts/relay-mac-client.mjs
          node --check scripts/relay-smoke-basic.mjs
          node --check scripts/relay-smoke-connector-scenarios.mjs
          node --check scripts/relay-smoke-env.mjs
          node --check scripts/relay-smoke-fixture.mjs
          node --check scripts/relay-smoke-mac-scenarios.mjs
          node --check scripts/relay-smoke-relay-scenarios.mjs
          node --check scripts/relay-smoke.mjs
          node --check scripts/verify-hf-space-core.mjs
          node --check tests/space-verify.test.mjs
          node --check tests/space-verify-fixture.mjs

      - name: Space verifier tests
        run: npm run test:space-verify

      - name: Relay smoke
        run: npm run smoke:relay

      - name: Start local server
        run: |
          HOST=127.0.0.1 PORT=3321 npm start > /tmp/codexmobile-server.log 2>&1 &
          echo $! > /tmp/codexmobile-server.pid

      - name: Local smoke
        run: npm run smoke

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/codexmobile-server.pid ]; then
            kill "$(cat /tmp/codexmobile-server.pid)" 2>/dev/null || true
          fi
          tail -n 100 /tmp/codexmobile-server.log 2>/dev/null || true

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check
